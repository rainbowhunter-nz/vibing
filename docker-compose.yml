services:
  vibing:
    # Image is built separately by scripts/build-image.sh; compose only runs it.
    image: vibing
    # PID 1 reaps orphaned subprocess descendants (e.g. `devcontainer up` keep-alives).
    init: true
    ports:
      - "8080:8080"
    volumes:
      - vibing-data:/data
      # Identical-path passthrough: host projects dir mounted at the SAME absolute
      # path inside the container so devcontainer bind-mounts resolve on the host.
      - ${PROJECTS_DIR}:${PROJECTS_DIR}
      # Container engine socket. Edit the SOURCE side for Podman — see .env.example.
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PROJECTS_DIR=${PROJECTS_DIR}

volumes:
  vibing-data:
